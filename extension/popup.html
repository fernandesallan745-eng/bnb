<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Voice Navigation Settings</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <header class="header">
      <div class="brand">
        <div class="logo-dot"></div>
        <h1>Voice Navigation</h1>
      </div>
      <span class="status-badge" id="status-badge">Idle</span>
    </header>

    <div class="section toggle-card">
      <div>
        <label for="enable-toggle" class="section-title">Enable Voice Navigation</label>
        <p class="section-desc">Floating mic & hands-free control</p>
      </div>
      <label class="switch">
        <input type="checkbox" id="enable-toggle">
        <span class="slider"></span>
      </label>
    </div>

    <div class="section toggle-card">
      <div>
        <label for="eye-toggle" class="section-title">Eye &amp; Head Tracking</label>
        <p class="section-desc">Gaze cursor with dwell-to-click</p>
      </div>
      <label class="switch">
        <input type="checkbox" id="eye-toggle">
        <span class="slider"></span>
      </label>
    </div>

    <div class="section">
      <label for="lang-select" class="section-title">Speech Language (Whisper)</label>
      <select id="lang-select" class="select-input">
        <option value="en">English (en)</option>
        <option value="es">Spanish (es)</option>
        <option value="fr">French (fr)</option>
        <option value="de">German (de)</option>
        <option value="it">Italian (it)</option>
        <option value="pt">Portuguese (pt)</option>
        <option value="ja">Japanese (ja)</option>
        <option value="zh">Chinese (zh)</option>
        <option value="hi">Hindi (hi)</option>
        <option value="auto">Auto Detect</option>
      </select>
    </div>

    <div class="section">
      <label for="server-url-input" class="section-title">Server Proxy URL</label>
      <input type="text" id="server-url-input" class="text-input" value="http://localhost:3001">
    </div>

    <div class="section">
      <div class="section-header">
        <span class="section-title">Custom Voice Commands</span>
      </div>
      <div class="command-form">
        <input type="text" id="new-phrase" class="text-input" placeholder="Spoken phrase (e.g. show pricing)">
        <select id="new-action" class="select-input">
          <option value="scroll_down">Scroll Down</option>
          <option value="scroll_up">Scroll Up</option>
          <option value="top">Go to Top</option>
          <option value="bottom">Go to Bottom</option>
          <option value="back">Go Back</option>
          <option value="forward">Go Forward</option>
          <option value="refresh">Refresh Page</option>
          <option value="read">Read Page</option>
        </select>
        <button type="button" id="add-cmd-btn" class="btn btn-primary">Add Command</button>
      </div>
      <div id="commands-list" class="commands-list"></div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
